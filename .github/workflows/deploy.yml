name: Deploy to Test2 Runner

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on:  self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Pull latest changes
        run: git pull
        working-directory: ./

      - name: Build and Restart Docker Services
        run: docker-compose up --build -d
        working-directory: ./
