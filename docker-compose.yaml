services:
  mongodb:
    image: mongo:latest
    container_name: mongoserver
    # environment: REPLICA SET ACARKEN KOLAYLIK OLMASI ICIN KULLANICIYI SONRADAN ACACAGIM
    #   # - MONGO_INITDB_ROOT_USERNAME=root
    #   # - MONGO_INITDB_ROOT_PASSWORD=rotten
    # volumes:
    #   - mongodb-data:/data/db
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0"] # MongoDB'yi Replica Set olarak başlatıyoruz
    networks:
      - network
  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - 3000:3000
    networks:
      - network

networks:
  network:
    driver: bridge
