version: "3.9"
services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    container_name: mongoserver
    networks:
      - host
    volumes:
      - mongo1_data:/data/db

  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api
    ports:
      - "3000:3000"
    networks:
      - host

networks:
  host:
    driver: host

volumes:
  mongo1_data:
  mongo1_config:
