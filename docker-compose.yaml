services:
  nginx:
    image: nginx:1.21.6
    container_name: nginx
    hostname: nginx
    ports:
      - 80:80
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network

  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - network

  mongodb:
    build:
      context: ./mongodb_rs
      dockerfile: ./Dockerfile
    restart: unless-stopped
    container_name: mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: REDACTED
      # MONGO_REPLICA_HOST: 0.0.0.0
      # MONGO_REPLICA_PORT: 27017
      MONGO_COMMAND: "mongosh"
    volumes:
      - mongodb:/data/db
    ports:
      - 27017:27017
    networks:
      - network

volumes:
  mongodb:
    driver: local

networks:
  network:
    driver: bridge
