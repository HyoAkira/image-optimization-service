services:
  nginx:
    image: nginx:1.21.6
    container_name: nginx
    hostname: nginx
    ports:
      - 80:80
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network

  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - network

  mongo6:
    build:
      context: ./mongodb_rs
    hostname: mpongodb
    container_name: mongodb
    environment:
      MONGO_REPLICA_HOST: 127.0.0.1
      MONGO_REPLICA_PORT: 27017
      # Use "mongo" instead of "mongosh" before v5.0
      MONGO_COMMAND: "mongosh"
    ports:
      - "27017:27017" # Ensure this is correctly indented as a list item
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "admin",
          "--port",
          "27017",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - mongo:/data/db

volumes:
  mongo:
    driver: local

networks:
  network:
    driver: bridge
