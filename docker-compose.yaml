services:
  mongodb:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - 27017:27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'0.0.0.0:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    container_name: mongoserver
    hostname: mongoserver
    networks:
      - network
    volumes:
      - "mongo1_data:/data/db"
      - "mongo1_config:/data/configdb"
  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api

    depends_on:
      mongodb:
        condition: service_healthy # MongoDB'nin sağlık durumu kontrol edilir
    ports:
      - 3000:3000
    networks:
      - network

networks:
  network:
    driver: bridge
volumes:
  mongo1_data:
  mongo1_config:
