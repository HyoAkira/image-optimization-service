services:
  mongodb:
    container_name: mongoserver
    build:
      context: ./mongodb_rs
    environment:
      MONGO_REPLICA_HOST: 0.0.0.0
      MONGO_REPLICA_PORT: 27017
      # Use "mongo" instead of "mongosh" before v5.0
      MONGO_COMMAND: "mongosh"
    volumes:
      - ./mongodb-data:/data/db
    ports:
      - "27017:27017" # Ensure this is correctly indented as a list item
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "admin",
          "--port",
          "27017",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - network

  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api
    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy # MongoDB'nin sağlık durumu kontrol edilir
    ports:
      - 3000:3000
    networks:
      - network

networks:
  network:
    driver: bridge
