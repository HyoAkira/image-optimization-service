services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    container_name: mongoserver
    networks:
      - mynetwork
    volumes:
      - mongo1_data:/data/db

  api:
    image: api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: api
    hostname: api
    ports:
      - "3000:3000"
    networks:
      - mynetwork

  nginx:
    image: nginx:latest
    container_name: nginx
    hostname: nginx
    ports:
      - 8080:80
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mynetwork
volumes:
  mongo1_data:
  mongo1_config:

networks:
  mynetwork:
    driver: bridge
